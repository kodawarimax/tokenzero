[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenzero"
version = "0.2.0"
description = "Deterministic Agent Kernel for Claude Code, OpenAI Codex, and Google Antigravity"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Kodawari MAX", email = "info@kodawari.co.jp" }
]
keywords = [
    "ai-agents",
    "claude-code",
    "codex",
    "antigravity",
    "deterministic",
    "formula-first",
    "ontology",
    "palantir-oag",
    "tokenzero"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[project.scripts]
tokenzero = "tokenzero.cli:main"

[project.urls]
Homepage = "https://github.com/kodawarimax/tokenzero"
Repository = "https://github.com/kodawarimax/tokenzero.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenzero*", "core*"]
